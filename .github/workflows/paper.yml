# Gera o rascunho do artigo do JOSS (paper/joss/paper.md) quando paper/ muda.
# A figura é refeita pela própria biblioteca antes da compilação; o PDF fica nos
# Artifacts da execução.
name: Artigo

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joss:
    name: Artigo JOSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar o pacote com o matplotlib
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plot]"
      - name: Gerar a figura a partir da biblioteca
        run: python paper/gerar_figuras.py
      - name: Gerar o rascunho com a ferramenta do JOSS
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/joss/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: artigo-joss
          path: paper/joss/paper.pdf
          if-no-files-found: error
