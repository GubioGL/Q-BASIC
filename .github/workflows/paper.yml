# Compila o artigo (português, LaTeX) e a versão para o JOSS (inglês) quando paper/ muda.
# Os PDFs ficam nos Artifacts da execução.
name: Artigo

on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artigo:
    name: Artigo (português)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar o LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended \
            texlive-latex-extra texlive-lang-portuguese texlive-fonts-recommended \
            texlive-science latexmk lmodern
      - name: Instalar o pacote com o matplotlib
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[plot]"
      - name: Gerar as figuras e os números a partir da biblioteca
        run: python paper/gerar_figuras.py
      - name: Compilar o PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -cd paper/artigo/main.tex
      - uses: actions/upload-artifact@v7
        with:
          name: artigo
          path: paper/artigo/main.pdf
          if-no-files-found: error

  joss:
    name: Versão JOSS (inglês)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Gerar o rascunho com a ferramenta do JOSS
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/joss/paper.md
      - uses: actions/upload-artifact@v7
        with:
          name: artigo-joss
          path: paper/joss/paper.pdf
          if-no-files-found: error
