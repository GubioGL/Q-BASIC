# Verificações automáticas antes de cada commit.
# Instalação (uma vez):  pip install -e ".[dev]" && pre-commit install
# Rodar em tudo:         pre-commit run --all-files
# Os notebooks (.ipynb) ficam de fora até a padronização da Fase 7.
exclude: '\.ipynb$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
