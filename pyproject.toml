# Configuração do pacote Q-BASIC (PEP 517/518/621).
# Substitui o antigo setup.py. Instalação para desenvolvimento:
#     pip install -e ".[dev]"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Q-BASIC"
dynamic = ["version"]
description = "Q-BASIC (Quantum Brazilian Algorithms, SImulations, and Computational tools): simulador quântico didático em Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gubio Gomes de Lima", email = "gubiofisikal@gmail.com" }]
maintainers = [{ name = "Gubio Gomes de Lima", email = "gubiofisikal@gmail.com" }]
keywords = [
    "quantum",
    "quantum simulation",
    "quantum computing",
    "quantum optics",
    "simulação quântica",
    "computação quântica",
    "ensino de física",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
# Limites inferiores testados no CI (job "dependências mínimas").
# IPython ainda é obrigatório porque ObjQuantico.__repr__ usa IPython.display;
# deixa de ser na Fase 4 (item 4.4 do PLANO_DE_TRABALHO.md).
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "sympy>=1.11",
    "ipython>=8.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
gpu = ["torch>=2.0"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "matplotlib>=3.6"]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "myst-nb>=1.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
]
tutorial = ["jupyterlab>=4.0", "matplotlib>=3.6", "qutip>=5.0"]
dev = [
    "Q-BASIC[test,plot]",
    "ruff>=0.17",
    "pre-commit>=3.5",
    "build>=1.2",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/GubioGL/Q-BASIC"
Source = "https://github.com/GubioGL/Q-BASIC"
Issues = "https://github.com/GubioGL/Q-BASIC/issues"

[tool.setuptools.dynamic]
version = { attr = "qbasic._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Testes
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
# Um teste marcado como xfail que passar vira erro: assim, quando um bug
# conhecido for corrigido, o teste avisa para remover a marcação.
xfail_strict = true
filterwarnings = [
    "error",
    # sympy < 1.13 usa APIs do mpmath >= 1.4 marcadas como obsoletas (não afeta o Q-BASIC).
    "ignore::DeprecationWarning:mpmath",
]

[tool.coverage.run]
branch = true
source = ["qbasic"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------------------
# Lint e formatação
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Os notebooks dos tutoriais serão padronizados na Fase 7.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # ordenação de imports
    "UP",  # sintaxe moderna do Python
    "B",   # bugbear (armadilhas comuns)
    "NPY", # boas práticas NumPy
    "PT",  # boas práticas pytest
]

[tool.ruff.lint.per-file-ignores]
# As mensagens de erro exatas só serão definidas quando os bugs forem corrigidos (Fase 4).
"tests/test_bugs_conhecidos.py" = ["PT011"]

[tool.ruff.lint.isort]
known-first-party = ["qbasic"]
